<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- outer circle -->
  <circle cx="32" cy="32" r="24" stroke="#9AA098" stroke-width="1.8"/>

  <!-- elongated atom orbits -->
  <ellipse cx="32" cy="32" rx="17.5" ry="7"
           stroke="#9AA098" stroke-width="2"/>

  <ellipse cx="32" cy="32" rx="17.5" ry="7"
           transform="rotate(60 32 32)"
           stroke="#9AA098" stroke-width="2"/>

  <ellipse cx="32" cy="32" rx="17.5" ry="7"
           transform="rotate(-60 32 32)"
           stroke="#9AA098" stroke-width="2"/>

  <!-- nucleus -->
  <circle cx="32" cy="32" r="2.6"
          stroke="#9AA098" stroke-width="2" fill="white"/>

  <!-- electrons moved outward to match the longer ellipses -->
  <circle cx="14.5" cy="32" r="2.6"
          stroke="#9AA098" stroke-width="2" fill="white"/>
  <circle cx="40.75" cy="16.85" r="2.6"
          stroke="#9AA098" stroke-width="2" fill="white"/>
  <circle cx="40.75" cy="47.15" r="2.6"
          stroke="#9AA098" stroke-width="2" fill="white"/>
</svg>
