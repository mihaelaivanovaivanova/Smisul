name: Deploy Smisul Testing

on:
  push:
    branches:
      - Deployment
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smisul-testing-deployment
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://sandboxandpayments.smisul.bg

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Enable deployment scripts
        run: |
          chmod +x scripts/prepare-staging-build.sh
          chmod +x scripts/deploy-staging-ftps.sh
          chmod +x scripts/verify-staging-deployment.sh

      - name: Verify staging deployment safety
        run: scripts/verify-staging-deployment.sh

      - name: Detect required PHP version
        id: php-version
        shell: bash
        run: |
          version="$(jq -r '.config.platform.php // .require.php' backend/composer.json)"
          version="$(sed -E 's/[^0-9]*([0-9]+\.[0-9]+).*/\1/' <<<"$version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+$ ]] || { echo 'Could not detect PHP version.' >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ steps.php-version.outputs.version }}
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, mbstring, openssl, pdo_mysql, session, tokenizer, xml
          coverage: none

      - name: Validate PHP syntax
        shell: bash
        run: |
          find backend deployment/public_html deployment/staging \
            -type f \
            -name '*.php' \
            -not -path '*/vendor/*' \
            -not -path '*/tests/*' \
            -print0 \
            | xargs -0 -r -n1 php -l

      - name: Install Composer production dependencies
        working-directory: backend
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Build existing frontend assets
        working-directory: frontend
        env:
          VITE_API_URL: /api
        run: |
          npm ci
          npm run build

      - name: Prepare isolated staging build
        env:
          STAGING_INCLUDE_INSTALLER: ${{ vars.STAGING_INCLUDE_INSTALLER }}
        run: scripts/prepare-staging-build.sh

      - name: Verify isolated staging build
        env:
          STAGING_INCLUDE_INSTALLER: ${{ vars.STAGING_INCLUDE_INSTALLER }}
        run: scripts/verify-staging-deployment.sh --build

      - name: Show exact deployment file count
        run: cat .build/staging-manifest.txt

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends lftp

      - name: Deploy isolated build using explicit FTPS
        env:
          STAGING_FTP_SERVER: ${{ secrets.STAGING_FTP_SERVER }}
          STAGING_FTP_PORT: ${{ secrets.STAGING_FTP_PORT }}
          STAGING_FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
          STAGING_FTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
          STAGING_FTP_REMOTE_ROOT: ${{ secrets.STAGING_FTP_REMOTE_ROOT }}
          STAGING_FTP_REMOTE_BACKEND: ${{ secrets.STAGING_FTP_REMOTE_BACKEND }}
        run: scripts/deploy-staging-ftps.sh

      - name: Non-destructive homepage check
        shell: bash
        run: |
          if status="$(curl --silent --show-error --location --max-time 20 --output /dev/null --write-out '%{http_code}' https://sandboxandpayments.smisul.bg/)"; then
            if [[ "$status" =~ ^[1-4][0-9][0-9]$ ]]; then
              echo "Staging homepage responded with HTTP $status."
            else
              echo "::warning::Staging homepage responded with HTTP $status; review server configuration."
            fi
          else
            echo '::warning::Staging homepage is not reachable yet. Configure DNS/subdomain and retry; deployment is not failed.'
          fi
